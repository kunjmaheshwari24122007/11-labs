<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none" role="img" aria-label="ElevenNarrate Logo">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8B5CF6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Studio Frame -->
  <rect x="2" y="2" width="36" height="36" rx="10" fill="#131923" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" />
  
  <!-- Waveform Audio Mark -->
  <g filter="url(#glow)">
    <rect x="8" y="16" width="3" height="8" rx="1.5" fill="url(#bar-grad)" opacity="0.75" />
    <rect x="13" y="11" width="3" height="18" rx="1.5" fill="url(#bar-grad)" opacity="0.9" />
    <rect x="18" y="7" width="3.5" height="26" rx="1.75" fill="url(#bar-grad)" />
    <rect x="24" y="13" width="3" height="14" rx="1.5" fill="url(#bar-grad)" opacity="0.9" />
    <rect x="29" y="17" width="3" height="6" rx="1.5" fill="url(#bar-grad)" opacity="0.75" />
  </g>
</svg>
